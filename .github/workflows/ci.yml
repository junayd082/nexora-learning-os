name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Core unit tests
        run: node --experimental-strip-types --test tests/*.test.mjs

      - name: Production build
        run: npm run build

      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner

      # Reported, not yet blocking: known advisories are tracked in docs/AUDIT.md (H7).
      # Becomes blocking once they are fixed in Milestone 4.
      - name: Dependency audit (production deps)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
